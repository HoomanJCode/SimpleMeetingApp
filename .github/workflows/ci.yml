name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  backend-lint-and-test:
    name: Backend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BACKEND_PORT: ${{ secrets.BACKEND_PORT || '3001' }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '5173' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:${{ env.BACKEND_PORT }}/api/auth/google/callback
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-for-testing
          FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}

  frontend-lint-and-test:
    name: Frontend lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    env:
      BACKEND_PORT: ${{ secrets.BACKEND_PORT || '3001' }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '5173' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Install dependencies (tests)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          # Dummy values are enough: E2E tests bypass OAuth via /api/test/login.
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:${{ env.BACKEND_PORT }}/api/auth/google/callback
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-for-testing
          FRONTEND_URL: http://localhost:${{ env.FRONTEND_PORT }}
          ENABLE_TEST_ROUTES: '1'
          NODE_ENV: test
          BACKEND_PORT: ${{ env.BACKEND_PORT }}
          FRONTEND_PORT: ${{ env.FRONTEND_PORT }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
